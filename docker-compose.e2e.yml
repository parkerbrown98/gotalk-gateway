# End-to-end test overlay: `make e2e`, or
#   go run ./internal/e2e/gen .e2e
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
#   go test -tags e2e ./internal/e2e
# Runs the gateway in development mode (http origins on private networks). The test serves
# the stand-in instance's well-known document on port 18080 of the host, a fake APNs on 18081,
# a fake FCM on 18082 and a fake browser push service on 18083, which the gateway reaches
# through host.docker.internal. The config and throwaway provider keys in .e2e/ are generated
# by internal/e2e/gen.
services:
  gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.e2e:/etc/gotalk-gateway/e2e:ro
    environment:
      GOTALK_GATEWAY_CONFIG: /etc/gotalk-gateway/e2e/config.yaml
      GOTALK_GATEWAY_SERVER_PUBLIC_URL: http://localhost:8090
      GOTALK_GATEWAY_INSTANCES_ALLOW_HTTP: "true"
      GOTALK_GATEWAY_INSTANCES_ALLOW_PRIVATE_NETWORKS: "true"
      GOTALK_GATEWAY_INSTANCES_ALLOWED_PORTS: "18080"
      # Browsers subscribe at the fake push service on the host, over plain http.
      GOTALK_GATEWAY_DEVICES_WEB_PUSH_HOSTS: host.docker.internal
      GOTALK_GATEWAY_DEVICES_WEB_PUSH_ALLOW_INSECURE: "true"
      # The test registers and verifies repeatedly from one address.
      GOTALK_GATEWAY_RATELIMIT_REGISTRATION: 1000-H
      GOTALK_GATEWAY_RATELIMIT_VERIFICATION: 1000-H
      GOTALK_GATEWAY_RATELIMIT_DEVICE_TOKEN: 1000-H
