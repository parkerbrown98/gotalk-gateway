name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  sqlc:
    name: sqlc in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - run: sqlc diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # PostgreSQL tests run in containers via testcontainers and the runner's Docker.
      # TestOpenAPIMatchesContract checks the implementation against docs/openapi.yaml.
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -n 1

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate docs/openapi.yaml
        run: |
          pip install --quiet openapi-spec-validator
          openapi-spec-validator docs/openapi.yaml
      # docs/oasdiff-levels.txt downgrades new response enum values: the protocol makes them
      # additive within a major version, and callers must tolerate them.
      - name: Check for breaking changes against the base branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git cat-file -e "origin/${{ github.base_ref }}:docs/openapi.yaml" 2>/dev/null; then
            echo "No contract on the base branch; nothing to compare."
            exit 0
          fi
          git show "origin/${{ github.base_ref }}:docs/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD/docs:/rev:ro" tufin/oasdiff \
            breaking /base/base.yaml /rev/openapi.yaml --fail-on ERR --severity-levels /rev/oasdiff-levels.txt

  compose:
    name: docker compose smoke and end-to-end test
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: ./scripts/smoke.sh http://localhost:8090
      # Registers an instance against the real binary, verifies it through the test's own
      # well-known server, and exercises signed requests, replay, rotation and recovery.
      - run: go test -count=1 -tags e2e ./internal/e2e
      - name: Graceful shutdown
        run: |
          docker compose stop gateway
          docker compose logs gateway | grep -q "shutdown complete"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, sqlc, test, openapi, compose]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gotalk-gateway
          tags: |
            type=ref,event=pr
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
